
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Desmos 表編集ツール</title>
<style>
  * { box-sizing: border-box; }

  body {
    font-family: system-ui, sans-serif;
    margin: 16px;
    color: #222;
    background: #f7f8fa;
  }

  h2 { margin: 0 0 12px; font-size: 22px; }

  button, input, select, textarea {
    font: inherit;
  }

  button {
    padding: 7px 12px;
    border: 1px solid #c7cbd1;
    border-radius: 6px;
    background: white;
    cursor: pointer;
  }

  button:hover { background: #edf2f7; }
  button:disabled { opacity: .4; cursor: default; }

  .toolbar {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
    margin: 12px 0;
  }

  .searchbar {
    position: sticky;
    top: 0;
    z-index: 5;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
    padding: 12px;
    background: #fff;
    border: 1px solid #d7dbe0;
    border-radius: 8px;
    box-shadow: 0 2px 6px #0000000b;
  }

  #searchInput {
    flex: 1;
    min-width: 130px;
    padding: 8px 10px;
    border: 1px solid #aeb5bf;
    border-radius: 6px;
  }

  #searchColumn {
    padding: 8px;
    border: 1px solid #aeb5bf;
    border-radius: 6px;
    background: white;
  }

  #searchCount {
    min-width: 70px;
    text-align: center;
    font-variant-numeric: tabular-nums;
    color: #454c56;
  }

  #status {
    margin: 10px 2px;
    min-height: 1.5em;
    font-size: 14px;
    color: #515965;
  }

  details {
    margin: 14px 0;
    padding: 10px;
    border: 1px solid #d7dbe0;
    border-radius: 8px;
    background: white;
  }

  textarea {
    width: 100%;
    min-height: 140px;
    margin-top: 8px;
    padding: 10px;
    font-family: Consolas, monospace;
    font-size: 13px;
  }

  .table-wrap {
    width: 100%;
    max-height: 65vh;
    overflow: auto;
    border: 1px solid #cbd0d7;
    border-radius: 8px;
    background: white;
  }

  table {
    width: 100%;
    table-layout: fixed;
    border-collapse: separate;
    border-spacing: 0;
  }

  col.row-col { width: 60px; }
  col.data-col { width: calc((100% - 60px) / 2); }

  th, td {
    height: 38px;
    padding: 0;
    border-right: 1px solid #e0e3e7;
    border-bottom: 1px solid #e0e3e7;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
  }

  th {
    position: sticky;
    top: 0;
    z-index: 2;
    background: #edf0f4;
    text-align: center;
    font-weight: 600;
  }

  th:first-child, .row-number {
    width: 60px;
    text-align: center;
    background: #f3f4f6;
    color: #606975;
  }

  .row-number {
    cursor: grab;
    user-select: none;
  }

  .row-number:active { cursor: grabbing; }

  td.data-cell { cursor: text; }

  td.data-cell .cell-text {
    display: block;
    overflow: hidden;
    padding: 8px;
    text-overflow: ellipsis;
  }

  td.data-cell:hover { background: #f3f7fc; }

  td.data-cell.selected {
    outline: 2px solid #477fcb;
    outline-offset: -2px;
  }

  td.data-cell.match {
    background: #fff0a8;
  }

  td.data-cell.current-match {
    background: #ffbd57;
    outline: 3px solid #df8613;
    outline-offset: -3px;
  }

  .cell-editor {
    display: block;
    width: 100%;
    min-width: 0;
    max-width: 100%;
    height: 36px;
    padding: 6px 8px;
    border: 2px solid #477fcb;
    border-radius: 0;
    outline: none;
    background: #fff;
  }

  tr.dragging { opacity: .4; }
  tr.drop-target { outline: 2px dashed #477fcb; }

  .bottom-controls {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin: 12px 0;
  }

  .hint {
    font-size: 13px;
    color: #656d78;
    line-height: 1.6;
  }

  @media (max-width: 600px) {
    body { margin: 8px; }
    .searchbar { gap: 6px; }
    #searchInput { flex-basis: 100%; }
  }
</style>
</head>
<body>

<h2>Desmos 表編集ツール</h2>

<div class="toolbar">
  <button id="undoBtn" onclick="undo()">↶ 元に戻す</button>
  <button id="redoBtn" onclick="redo()">↷ やり直す</button>
  <button onclick="copyTable()">表をコピー</button>
  <button onclick="clearTable()">表をクリア</button>
</div>

<div class="searchbar">
  <input id="searchInput" type="text"
         placeholder="検索する文字を入力…" autocomplete="off">

  <select id="searchColumn" aria-label="検索する列">
    <option value="both">両方</option>
    <option value="x">x列</option>
    <option value="y">y列</option>
  </select>

  <button onclick="moveMatch(-1)" title="前の一致箇所">↑</button>
  <button onclick="moveMatch(1)" title="次の一致箇所">↓</button>

  <span id="searchCount">0 / 0</span>
</div>

<div id="status">Desmos の表データを読み込んでください。</div>

<details>
  <summary>元データの読み込み</summary>
  <p class="hint">
    Desmos の表データを貼り付けて「読み込み」を押してください。
    x_1 と y_1 の配列を読み込みます。
  </p>
  <textarea id="sourceInput"
    placeholder="Desmos の表データをここに貼り付け"></textarea>
  <div class="toolbar">
    <button onclick="loadSource()">読み込み</button>
  </div>
</details>

<div class="table-wrap">
  <table id="dataTable">
    <colgroup>
      <col class="row-col">
      <col class="data-col">
      <col class="data-col">
    </colgroup>
    <thead>
      <tr>
        <th>行</th>
        <th>x₁</th>
        <th>y₁</th>
      </tr>
    </thead>
    <tbody id="tableBody"></tbody>
  </table>
</div>

<div class="bottom-controls">
  <button onclick="appendRow()">＋ 最後に行を追加</button>
  <button onclick="copyTable()">表をコピー</button>
</div>

<p class="hint">
  セルをクリックすると直接編集できます。行番号を右クリックすると、
  行の挿入・削除・入れ替えができます。行番号をドラッグしても並べ替えられます。
  検索は部分一致です。
</p>

<script>
let rows = [];
let selectedCell = null;
let matches = [];
let matchIndex = -1;
let history = [];
let future = [];
let dragIndex = null;

const $ = id => document.getElementById(id);

function setStatus(message) {
  $("status").textContent = message;
}

function snapshot() {
  history.push(JSON.stringify(rows));
  if (history.length > 100) history.shift();
  future = [];
  updateHistoryButtons();
}

function updateHistoryButtons() {
  $("undoBtn").disabled = history.length === 0;
  $("redoBtn").disabled = future.length === 0;
}

function undo() {
  if (!history.length) return;
  future.push(JSON.stringify(rows));
  rows = JSON.parse(history.pop());
  selectedCell = null;
  render();
  updateHistoryButtons();
  setStatus("操作を元に戻しました。");
}

function redo() {
  if (!future.length) return;
  history.push(JSON.stringify(rows));
  rows = JSON.parse(future.pop());
  selectedCell = null;
  render();
  updateHistoryButtons();
  setStatus("操作をやり直しました。");
}

function parseArray(source, name) {
  const escaped = name.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  const regex = new RegExp(
    escaped + "\\s*=\\s*\\[([\\s\\S]*?)\\]",
    "m"
  );
  const found = source.match(regex);
  if (!found) return null;

  return found[1].split(",")
    .map(v => v.trim())
    .filter(v => v !== "");
}

function loadSource() {
  const source = $("sourceInput").value;
  const xs = parseArray(source, "x_1");
  const ys = parseArray(source, "y_1");

  if (!xs || !ys) {
    setStatus("x_1 または y_1 の配列が見つかりません。");
    return;
  }

  snapshot();
  const length = Math.max(xs.length, ys.length);
  rows = Array.from({ length }, (_, i) => ({
    x: xs[i] ?? "",
    y: ys[i] ?? ""
  }));

  selectedCell = null;
  render();
  setStatus(`${rows.length} 行を読み込みました。`);
}

function render() {
  const tbody = $("tableBody");
  tbody.replaceChildren();

  rows.forEach((row, index) => {
    const tr = document.createElement("tr");
    tr.dataset.index = index;

    const numberCell = document.createElement("td");
    numberCell.className = "row-number";
    numberCell.textContent = index + 1;
    numberCell.title = "右クリックで行の操作／ドラッグで並べ替え";
    numberCell.addEventListener("contextmenu", event => {
      event.preventDefault();
      rowMenu(index);
    });
    numberCell.draggable = true;
    numberCell.addEventListener("dragstart", event => {
      dragIndex = index;
      tr.classList.add("dragging");
      event.dataTransfer.effectAllowed = "move";
    });
    numberCell.addEventListener("dragend", () => {
      dragIndex = null;
      document.querySelectorAll("tr").forEach(r =>
        r.classList.remove("dragging", "drop-target")
      );
    });
    tr.addEventListener("dragover", event => {
      if (dragIndex === null || dragIndex === index) return;
      event.preventDefault();
      tr.classList.add("drop-target");
    });
    tr.addEventListener("dragleave", () => {
      tr.classList.remove("drop-target");
    });
    tr.addEventListener("drop", event => {
      event.preventDefault();
      if (dragIndex === null || dragIndex === index) return;
      snapshot();
      const moved = rows.splice(dragIndex, 1)[0];
      rows.splice(index, 0, moved);
      selectedCell = null;
      render();
      updateSearch(false);
      setStatus("行を並べ替えました。");
    });

    tr.appendChild(numberCell);

    ["x", "y"].forEach(key => {
      const td = document.createElement("td");
      td.className = "data-cell";
      td.dataset.row = index;
      td.dataset.col = key;

      const isSelected = selectedCell &&
        selectedCell.row === index && selectedCell.col === key;
      if (isSelected) td.classList.add("selected");

      const span = document.createElement("span");
      span.className = "cell-text";
      span.textContent = row[key];
      td.appendChild(span);
      td.addEventListener("click", () => editCell(td, index, key));

      tr.appendChild(td);
    });

    tbody.appendChild(tr);
  });

  updateSearch(false);
  updateHistoryButtons();
}

function editCell(td, rowIndex, key) {
  if (td.querySelector("input")) return;

  selectedCell = { row: rowIndex, col: key };
  const oldValue = rows[rowIndex][key];
  td.classList.add("selected");
  td.replaceChildren();

  const input = document.createElement("input");
  input.type = "text";
  input.className = "cell-editor";
  input.value = oldValue;
  input.setAttribute("aria-label", `${rowIndex + 1}行目 ${key}列`);
  td.appendChild(input);
  input.focus();
  input.select();

  let finished = false;

  function finish(save) {
    if (finished) return;
    finished = true;

    const newValue = input.value;
    if (save && newValue !== oldValue) {
      snapshot();
      rows[rowIndex][key] = newValue;
    }

    selectedCell = { row: rowIndex, col: key };
    render();
    if (save && newValue !== oldValue) {
      setStatus(`${rowIndex + 1}行目の${key}列を編集しました。`);
    }
  }

  input.addEventListener("keydown", event => {
    if (event.key === "Enter") {
      event.preventDefault();
      finish(true);
    }
    if (event.key === "Escape") {
      event.preventDefault();
      finish(false);
    }
    if (event.key === "Tab") {
      event.preventDefault();
      finish(true);
      const nextKey = key === "x" ? "y" : "x";
      const nextRow = key === "x" ? rowIndex : rowIndex + 1;
      if (rows[nextRow]) {
        const nextCell = document.querySelector(
          `td[data-row="${nextRow}"][data-col="${nextKey}"]`
        );
        if (nextCell) editCell(nextCell, nextRow, nextKey);
      }
    }
  });

  input.addEventListener("blur", () => finish(true));
}

function rowMenu(index) {
  const action = prompt(
    `${index + 1}行目の操作\n` +
    "1：この行の前に挿入\n" +
    "2：この行を削除\n" +
    "3：別の行と入れ替え\n" +
    "番号を入力してください"
  );

  if (action === "1") {
    snapshot();
    rows.splice(index, 0, { x: "", y: "" });
    render();
    setStatus(`${index + 1}行目の前に行を挿入しました。`);
  } else if (action === "2") {
    if (!confirm(`${index + 1}行目を削除しますか？`)) return;
    snapshot();
    rows.splice(index, 1);
    selectedCell = null;
    render();
    setStatus(`${index + 1}行目を削除しました。`);
  } else if (action === "3") {
    const input = prompt(
      `入れ替え先の行番号を入力してください（1〜${rows.length}）`
    );
    if (input === null || input.trim() === "") return;
    const target = Number(input) - 1;
    if (!Number.isInteger(target) || target < 0 || target >= rows.length) {
      setStatus("有効な行番号を入力してください。");
      return;
    }
    if (target === index) return;

    snapshot();
    [rows[index], rows[target]] = [rows[target], rows[index]];
    render();
    setStatus(`${index + 1}行目と${target + 1}行目を入れ替えました。`);
  }
}

function appendRow() {
  snapshot();
  rows.push({ x: "", y: "" });
  render();
  setStatus("最後に行を追加しました。");
}

function clearTable() {
  if (!confirm("表のデータをすべて消去しますか？")) return;
  snapshot();
  rows = [];
  selectedCell = null;
  render();
  setStatus("表をクリアしました。");
}

function copyTable() {
  const text = rows.map(row => `${row.x}\t${row.y}`).join("\n");
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(text)
      .then(() => setStatus("表をコピーしました。"))
      .catch(() => copyFallback(text));
  } else {
    copyFallback(text);
  }
}

function copyFallback(text) {
  const area = document.createElement("textarea");
  area.value = text;
  document.body.appendChild(area);
  area.select();
  try {
    document.execCommand("copy");
    setStatus("表をコピーしました。");
  } catch {
    setStatus("コピーできませんでした。ブラウザの権限を確認してください。");
  }
  area.remove();
}

/* 検索 */

$("searchInput").addEventListener("input", () => updateSearch(true));
$("searchColumn").addEventListener("change", () => updateSearch(true));

function updateSearch(jumpToFirst = true) {
  const query = $("searchInput").value;
  const column = $("searchColumn").value;
  matches = [];
  matchIndex = -1;

  if (query !== "") {
    rows.forEach((row, rowIndex) => {
      const keys = column === "both" ? ["x", "y"] : [column];
      keys.forEach(key => {
        if (String(row[key]).includes(query)) {
          matches.push({ row: rowIndex, col: key });
        }
      });
    });
  }

  if (matches.length) {
    matchIndex = 0;
    if (jumpToFirst) scrollToMatch();
  }

  $("searchCount").textContent = matches.length
    ? `${matchIndex + 1} / ${matches.length}`
    : "0 / 0";

  highlightMatches();
}

function highlightMatches() {
  document.querySelectorAll("td.data-cell").forEach(td => {
    td.classList.remove("match", "current-match");
  });

  matches.forEach((match, index) => {
    const td = document.querySelector(
      `td[data-row="${match.row}"][data-col="${match.col}"]`
    );
    if (!td) return;
    td.classList.add("match");
    if (index === matchIndex) td.classList.add("current-match");
  });

  $("searchCount").textContent = matches.length
    ? `${matchIndex + 1} / ${matches.length}`
    : "0 / 0";
}

function scrollToMatch() {
  if (matchIndex < 0 || !matches[matchIndex]) return;
  const match = matches[matchIndex];
  const td = document.querySelector(
    `td[data-row="${match.row}"][data-col="${match.col}"]`
  );
  if (!td) return;

  td.scrollIntoView({ behavior: "smooth", block: "center", inline: "nearest" });
  highlightMatches();
}

function moveMatch(direction) {
  if (!matches.length) {
    setStatus("一致する箇所がありません。");
    return;
  }
  matchIndex = (matchIndex + direction + matches.length) % matches.length;
  scrollToMatch();
}

/* Enter / Shift+Enter でも検索結果を移動 */
$("searchInput").addEventListener("keydown", event => {
  if (event.key === "Enter") {
    event.preventDefault();
    moveMatch(event.shiftKey ? -1 : 1);
  }
});

/* ① 値の置換：検索語を対象に、選択した列の部分文字列を置き換える */
function replaceValues() {
  const query = $("searchInput").value;
  if (!query) {
    setStatus("先に検索欄に置換対象の文字を入力してください。");
    return;
  }

  const replacement = prompt(
    `「${query}」を何に置き換えますか？`,
    ""
  );
  if (replacement === null) return;

  const column = $("searchColumn").value;
  const keys = column === "both" ? ["x", "y"] : [column];

  let count = 0;
  const changed = rows.map(row => {
    const copy = { ...row };
    keys.forEach(key => {
      if (String(copy[key]).includes(query)) {
        copy[key] = String(copy[key]).split(query).join(replacement);
        count++;
      }
    });
    return copy;
  });

  if (!count) {
    setStatus("置換対象がありません。");
    return;
  }

  snapshot();
  rows = changed;
  render();
  setStatus(`${count} 個のセルを置換しました。`);
}

/* Ctrl+H で置換 */
document.addEventListener("keydown", event => {
  if (event.ctrlKey && event.key.toLowerCase() === "h") {
    event.preventDefault();
    replaceValues();
  }
});

updateHistoryButtons();
render();
</script>
</body>
</html>
