
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Desmos表ビューア</title>
<style>
  body {
    font-family: sans-serif;
    margin: 24px;
    background: #f5f6f8;
    color: #222;
  }
  h1 { font-size: 24px; }
  textarea {
    width: 100%;
    height: 220px;
    box-sizing: border-box;
    padding: 12px;
    font-family: monospace;
    border: 1px solid #bbb;
    border-radius: 8px;
    background: white;
  }
  button, input {
    padding: 9px 12px;
    margin: 6px 4px 6px 0;
  }
  button { cursor: pointer; }
  #status { margin: 12px 0; }
  .table-wrap {
    max-height: 60vh;
    overflow: auto;
    background: white;
    border: 1px solid #ccc;
  }
  table {
    width: 100%;
    border-collapse: collapse;
  }
  th, td {
    padding: 7px 12px;
    border-bottom: 1px solid #ddd;
    text-align: right;
  }
  th {
    position: sticky;
    top: 0;
    background: #e8edf4;
  }
  th:first-child, td:first-child { text-align: center; }
  tr.highlight { background: #fff0a8; }
</style>
</head>
<body>

<h1>Desmos表ビューア</h1>
<p>拡張機能で取得した table の内容を貼り付けてください。</p>

<textarea id="source"
 placeholder="ここに table { ... } を貼り付け"></textarea>
<br>
<button id="convert">表に変換</button>
<button id="clear">クリア</button>
<button id="copy" disabled>表をコピー</button>

<p id="status">データを待っています。</p>

<div>
  <label>
    行へ移動：
    <input id="jump" type="number" min="1" placeholder="行番号">
  </label>
  <button id="go">移動</button>
  <br>
  <label>
    部分一致検索：
    <input id="search" placeholder="検索する値">
  </label>
</div>

<div class="table-wrap">
<table>
  <thead>
    <tr><th>行</th><th>x₁</th><th>y₁</th></tr>
  </thead>
  <tbody id="result">
    <tr><td colspan="3">データがありません</td></tr>
  </tbody>
</table>
</div>

<script>
const $ = id => document.getElementById(id);
let rows = [];

function getArray(text, name) {
  const re = new RegExp(
    name + "\\s*=\\s*\\[([\\s\\S]*?)\\]"
  );
  const match = text.match(re);

  if (!match) {
    throw new Error(name + " が見つかりません");
  }

  if (!match[1].trim()) return [];

  return match[1].split(",").map(value => {
    const s = value.trim();
    if (s === "" || !Number.isFinite(Number(s))) {
      throw new Error("数値を読み取れません: " + s);
    }
    return s;
  });
}

function render() {
  const query = $("search").value.trim().toLowerCase();
  const body = $("result");
  body.replaceChildren();

  const found = rows
    .map((r, i) => ({ ...r, index: i }))
    .filter(r =>
      !query ||
      r.x.toLowerCase().includes(query) ||
      r.y.toLowerCase().includes(query)
    );

  $("status").textContent =
    rows.length + "行中 " + found.length + "行が一致";

  if (!found.length) {
    body.innerHTML =
      '<tr><td colspan="3">該当するデータがありません</td></tr>';
    return;
  }

  for (const r of found) {
    const tr = document.createElement("tr");
    tr.dataset.index = r.index;

    for (const value of [r.index + 1, r.x, r.y]) {
      const td = document.createElement("td");
      td.textContent = value;
      tr.appendChild(td);
    }
    body.appendChild(tr);
  }
}

$("convert").onclick = () => {
  try {
    const text = $("source").value;
    const xs = getArray(text, "x_1");
    const ys = getArray(text, "y_1");

    if (xs.length !== ys.length) {
      throw new Error(
        "列の長さが違います。x₁=" + xs.length +
        "個、y₁=" + ys.length + "個"
      );
    }

    rows = xs.map((x, i) => ({ x, y: ys[i] }));
    $("copy").disabled = false;
    render();
  } catch (e) {
    $("status").textContent = "エラー：" + e.message;
  }
};

$("search").addEventListener("input", render);

$("go").onclick = () => {
  const n = Number($("jump").value);
  if (!Number.isInteger(n) || n < 1 || n > rows.length) {
    $("status").textContent =
      "1〜" + rows.length + "の行番号を入力してください";
    return;
  }

  $("search").value = "";
  render();

  const tr = $("result").querySelector(
    'tr[data-index="' + (n - 1) + '"]'
  );

  if (tr) {
    tr.scrollIntoView({ block: "center" });
    tr.classList.add("highlight");
  }
};

$("copy").onclick = async () => {
  const text = rows.map(r => r.x + "\t" + r.y).join("\n");
  try {
    await navigator.clipboard.writeText(text);
    $("status").textContent = "表をコピーしました";
  } catch {
    $("status").textContent =
      "コピーできませんでした。ブラウザの権限を確認してください";
  }
};

$("clear").onclick = () => {
  rows = [];
  $("source").value = "";
  $("search").value = "";
  $("result").innerHTML =
    '<tr><td colspan="3">データがありません</td></tr>';
  $("copy").disabled = true;
  $("status").textContent = "クリアしました";
};
</script>

</body>
</html>
