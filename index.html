
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Desmos 表データ編集ツール</title>
<style>
  body {
    font-family: sans-serif;
    margin: 20px;
    color: #222;
  }

  h1 {
    font-size: 22px;
  }

  textarea {
    width: 100%;
    height: 110px;
    box-sizing: border-box;
    font-family: monospace;
    font-size: 14px;
    margin-bottom: 10px;
  }

  button, select, input {
    font-size: 14px;
    padding: 5px;
  }

  button {
    cursor: pointer;
  }

  .toolbar {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    align-items: center;
    margin: 10px 0;
  }

  .searchbar {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    align-items: center;
    margin: 10px 0;
  }

  #searchInput {
    min-width: 180px;
  }

  #tableContainer {
    overflow: auto;
    max-height: 65vh;
    border: 1px solid #ccc;
  }

  table {
    border-collapse: collapse;
    width: 100%;
    table-layout: fixed;
  }

  th, td {
    border: 1px solid #ccc;
    padding: 0;
    height: 32px;
    text-align: left;
  }

  th {
    background: #f2f2f2;
    text-align: center;
    position: sticky;
    top: 0;
    z-index: 1;
  }

  th:first-child,
  td.rowNumber {
    width: 55px;
  }

  th:not(:first-child) {
    width: calc((100% - 55px) / 2);
  }

  td.rowNumber {
    text-align: center;
    background: #f7f7f7;
    cursor: grab;
    user-select: none;
  }

  td.rowNumber:active {
    cursor: grabbing;
  }

  tr.selected td {
    background-color: #e7f2ff;
  }

  tr.selected td.rowNumber {
    background-color: #cfe5ff;
  }

  td.found {
    background-color: #fff1a8 !important;
  }

  td.currentMatch {
    outline: 2px solid #e69500;
    outline-offset: -2px;
  }

  td.cell {
    cursor: text;
    padding: 0 6px;
    overflow-wrap: anywhere;
  }

  td.cell input {
    width: 100%;
    height: 32px;
    border: 2px solid #2878d0;
    box-sizing: border-box;
    padding: 3px 5px;
    font: inherit;
    outline: none;
  }

  tr.dragOver td {
    border-top: 3px solid #2878d0;
  }

  #status {
    margin: 8px 0;
    color: #555;
    font-size: 13px;
  }
</style>
</head>
<body>

<h1>Desmos 表データ編集ツール</h1>

<label for="sourceData"><strong>データ入力欄</strong></label>
<textarea id="sourceData" placeholder="例：
x_1 = [1, 2, 3]
y_1 = [4, 5, 6]"></textarea>

<div class="toolbar">
  <button id="loadButton">データを読み込む</button>
  <button id="exportButton">データを出力欄に反映</button>
  <button id="addRowButton">行を追加</button>
  <button id="deleteRowButton">選択行を削除</button>
  <button id="copyButton">表をコピー</button>
  <button id="undoButton">元に戻す</button>
  <button id="redoButton">やり直す</button>
</div>

<div class="searchbar">
  <label for="searchColumn">検索列：</label>
  <select id="searchColumn">
    <option value="both">両方</option>
    <option value="x">x列</option>
    <option value="y">y列</option>
  </select>

  <input id="searchInput" type="text" placeholder="検索文字列">
  <button id="searchButton">検索</button>
  <button id="prevMatchButton">前へ</button>
  <button id="nextMatchButton">次へ</button>
  <span id="matchCount">0 / 0</span>

  <button id="replaceButton">一致部分を置換</button>
</div>

<div id="status">データを入力するか、読み込んでください。</div>

<div id="tableContainer">
  <table>
    <thead>
      <tr>
        <th>行</th>
        <th>x</th>
        <th>y</th>
      </tr>
    </thead>
    <tbody id="tableBody"></tbody>
  </table>
</div>

<script>
const sourceData = document.getElementById("sourceData");
const tableBody = document.getElementById("tableBody");
const status = document.getElementById("status");

const searchInput = document.getElementById("searchInput");
const searchColumn = document.getElementById("searchColumn");
const matchCount = document.getElementById("matchCount");

let rows = [];
let selectedRow = null;
let selectedCell = null;
let editing = false;

let matches = [];
let matchIndex = -1;

let undoStack = [];
let redoStack = [];
const MAX_HISTORY = 100;

let dragSourceIndex = null;

function setStatus(message) {
  status.textContent = message;
}

function snapshot() {
  undoStack.push(JSON.stringify(rows));
  if (undoStack.length > MAX_HISTORY) {
    undoStack.shift();
  }
  redoStack = [];
  updateHistoryButtons();
}

function updateHistoryButtons() {
  document.getElementById("undoButton").disabled = undoStack.length === 0;
  document.getElementById("redoButton").disabled = redoStack.length === 0;
}

function undo() {
  if (!undoStack.length) return;

  redoStack.push(JSON.stringify(rows));
  rows = JSON.parse(undoStack.pop());
  selectedRow = null;
  selectedCell = null;
  render();
  updateHistoryButtons();
  setStatus("操作を元に戻しました。");
}

function redo() {
  if (!redoStack.length) return;

  undoStack.push(JSON.stringify(rows));
  rows = JSON.parse(redoStack.pop());
  selectedRow = null;
  selectedCell = null;
  render();
  updateHistoryButtons();
  setStatus("操作をやり直しました。");
}

function parseArray(text, variable) {
  const escaped = variable.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  const regex = new RegExp(
    "(?:^|\\n)\\s*" + escaped + "\\s*=\\s*\\[([\\s\\S]*?)\\]",
    "m"
  );

  const match = text.match(regex);
  if (!match) return null;

  const content = match[1].trim();
  if (content === "") return [];

  return content.split(",").map(value => value.trim());
}

function loadData() {
  const text = sourceData.value;
  const xValues = parseArray(text, "x_1");
  const yValues = parseArray(text, "y_1");

  if (xValues === null && yValues === null) {
    setStatus("x_1 または y_1 の配列が見つかりません。");
    return;
  }

  snapshot();

  const xs = xValues || [];
  const ys = yValues || [];
  const length = Math.max(xs.length, ys.length);

  rows = [];

  for (let i = 0; i < length; i++) {
    rows.push({
      x: xs[i] ?? "",
      y: ys[i] ?? ""
    });
  }

  selectedRow = rows.length ? 0 : null;
  selectedCell = null;
  render();
  setStatus(`${rows.length} 行を読み込みました。`);
}

function exportData() {
  const xs = rows.map(row => row.x).join(", ");
  const ys = rows.map(row => row.y).join(", ");

  sourceData.value = `x_1 = [${xs}]\ny_1 = [${ys}]`;
  setStatus("データを出力欄に反映しました。");
}

function render() {
  tableBody.innerHTML = "";

  rows.forEach((row, index) => {
    const tr = document.createElement("tr");
    tr.dataset.index = index;

    if (index === selectedRow) {
      tr.classList.add("selected");
    }

    const numberCell = document.createElement("td");
    numberCell.className = "rowNumber";
    numberCell.textContent = index + 1;
    numberCell.draggable = true;
    numberCell.title = "ドラッグして行を並べ替え";

    numberCell.addEventListener("click", () => {
      selectedRow = index;
      selectedCell = null;
      render();
    });

    numberCell.addEventListener("dragstart", event => {
      dragSourceIndex = index;
      event.dataTransfer.effectAllowed = "move";
      event.dataTransfer.setData("text/plain", String(index));
    });

    tr.addEventListener("dragover", event => {
      event.preventDefault();
      tr.classList.add("dragOver");
      event.dataTransfer.dropEffect = "move";
    });

    tr.addEventListener("dragleave", () => {
      tr.classList.remove("dragOver");
    });

    tr.addEventListener("drop", event => {
      event.preventDefault();
      tr.classList.remove("dragOver");

      const from = dragSourceIndex;
      const to = index;

      if (from === null || from === to || from < 0 || from >= rows.length) {
        return;
      }

      snapshot();

      const moved = rows.splice(from, 1)[0];
      const destination = from < to ? to - 1 : to;
      rows.splice(destination, 0, moved);

      selectedRow = destination;
      selectedCell = null;
      dragSourceIndex = null;
      render();
      setStatus("行を並べ替えました。");
    });

    tr.appendChild(numberCell);

    ["x", "y"].forEach(column => {
      const td = document.createElement("td");
      td.className = "cell";
      td.dataset.row = index;
      td.dataset.column = column;
      td.textContent = row[column];

      td.addEventListener("click", () => {
        selectedRow = index;
        selectedCell = column;
        render();
        editCell(index, column);
      });

      tr.appendChild(td);
    });

    tableBody.appendChild(tr);
  });

  updateSearch(false);
  updateHistoryButtons();
}

function editCell(rowIndex, column) {
  const tr = tableBody.querySelector(`tr[data-index="${rowIndex}"]`);
  if (!tr) return;

  const td = tr.querySelector(`td[data-column="${column}"]`);
  if (!td) return;

  const input = document.createElement("input");
  input.type = "text";
  input.value = rows[rowIndex][column];

  td.textContent = "";
  td.appendChild(input);

  editing = true;
  selectedRow = rowIndex;
  selectedCell = column;

  let finished = false;

  input.focus();
  input.select();

  function finish(save = true) {
    if (finished) return;
    finished = true;

    if (save && rows[rowIndex]) {
      const newValue = input.value;

      if (rows[rowIndex][column] !== newValue) {
        snapshot();
        rows[rowIndex][column] = newValue;
      }
    }

    editing = false;
    render();
  }

  input.addEventListener("keydown", event => {
    if (event.key === "Backspace" &&
        input.value === "" &&
        !event.isComposing) {

      event.preventDefault();
      event.stopPropagation();

      if (finished) return;
      finished = true;
      editing = false;

      const deletedIndex = rowIndex;

      snapshot();
      rows.splice(deletedIndex, 1);

      // 削除した行のひとつ前を選択する。
      // 先頭行を削除した場合は、新しい先頭行を選択する。
      if (rows.length === 0) {
        selectedRow = null;
        selectedCell = null;
        render();
        setStatus("行を削除しました。");
        return;
      }

      selectedRow = deletedIndex > 0
        ? deletedIndex - 1
        : 0;

      selectedCell = "x";

      render();
      setStatus("行を削除しました。");

      // 再描画後、ひとつ前の行のx列を入力モードにする。
      requestAnimationFrame(() => {
        if (selectedRow !== null && rows[selectedRow]) {
          editCell(selectedRow, "x");
        }
      });

      return;
    }

    if (event.key === "Enter") {
      event.preventDefault();
      event.stopPropagation();

      const currentValue = input.value;

      if (!finished && rows[rowIndex] &&
          rows[rowIndex][column] !== currentValue) {
        snapshot();
        rows[rowIndex][column] = currentValue;
      }

      if (finished) return;
      finished = true;
      editing = false;

      selectedRow = rowIndex;
      selectedCell = column;

      insertAfterSelected();
    }

    if (event.key === "Escape") {
      event.preventDefault();
      event.stopPropagation();
      finish(false);
    }

    if (event.key === "Tab") {
      event.preventDefault();
      event.stopPropagation();

      const nextRow = column === "x" ? rowIndex : rowIndex + 1;
      const nextColumn = column === "x" ? "y" : "x";

      finish(true);

      if (nextRow < rows.length) {
        selectedRow = nextRow;
        selectedCell = nextColumn;
        render();
        editCell(nextRow, nextColumn);
      }
    }
  });

  input.addEventListener("blur", () => {
    finish(true);
  });
}

function insertAfterSelected() {
  if (selectedRow === null) return;

  const insertIndex = selectedRow + 1;

  snapshot();
  rows.splice(insertIndex, 0, { x: "", y: "" });

  selectedRow = insertIndex;
  selectedCell = "x";

  render();
  editCell(insertIndex, "x");
}

function addRow() {
  snapshot();

  const insertIndex = selectedRow === null
    ? rows.length
    : selectedRow + 1;

  rows.splice(insertIndex, 0, { x: "", y: "" });
  selectedRow = insertIndex;
  selectedCell = "x";

  render();
  editCell(insertIndex, "x");
}

function deleteSelectedRow() {
  if (selectedRow === null || !rows[selectedRow]) return;

  const deletedIndex = selectedRow;

  snapshot();
  rows.splice(deletedIndex, 1);

  if (rows.length === 0) {
    selectedRow = null;
    selectedCell = null;
    render();
    setStatus("行を削除しました。");
    return;
  }

  selectedRow = deletedIndex > 0
    ? deletedIndex - 1
    : 0;

  selectedCell = "x";
  render();

  requestAnimationFrame(() => {
    if (selectedRow !== null && rows[selectedRow]) {
      editCell(selectedRow, "x");
    }
  });

  setStatus("行を削除しました。");
}

function updateSearch(resetIndex = true) {
  const query = searchInput.value;
  const columnChoice = searchColumn.value;

  matches = [];

  if (query !== "") {
    rows.forEach((row, rowIndex) => {
      const columns = columnChoice === "both"
        ? ["x", "y"]
        : [columnChoice];

      columns.forEach(column => {
        if (String(row[column]).includes(query)) {
          matches.push({ row: rowIndex, column });
        }
      });
    });
  }

  if (resetIndex) {
    matchIndex = matches.length ? 0 : -1;
  } else if (matchIndex >= matches.length) {
    matchIndex = matches.length - 1;
  }

  renderSearchHighlights();
}

function renderSearchHighlights() {
  tableBody.querySelectorAll("td.cell").forEach(td => {
    td.classList.remove("found", "currentMatch");
  });

  matches.forEach((match, index) => {
    const td = tableBody.querySelector(
      `td[data-row="${match.row}"][data-column="${match.column}"]`
    );

    if (td) {
      td.classList.add("found");

      if (index === matchIndex) {
        td.classList.add("currentMatch");
      }
    }
  });

  matchCount.textContent = matches.length
    ? `${matchIndex + 1} / ${matches.length}`
    : "0 / 0";
}

function moveMatch(direction) {
  if (!matches.length) {
    updateSearch(true);
    return;
  }

  matchIndex = (matchIndex + direction + matches.length) % matches.length;

  const match = matches[matchIndex];
  selectedRow = match.row;
  selectedCell = match.column;

  render();
  renderSearchHighlights();

  const td = tableBody.querySelector(
    `td[data-row="${match.row}"][data-column="${match.column}"]`
  );

  if (td) {
    td.scrollIntoView({ block: "nearest" });
  }
}

function replaceValues() {
  const query = searchInput.value;

  if (!query) {
    setStatus("置換する文字列を入力してください。");
    return;
  }

  const replacement = prompt("置換後の文字列を入力してください：");
  if (replacement === null) return;

  const columnChoice = searchColumn.value;
  let count = 0;

  const updatedRows = rows.map(row => {
    const copy = { ...row };

    const columns = columnChoice === "both"
      ? ["x", "y"]
      : [columnChoice];

    columns.forEach(column => {
      const value = String(copy[column]);

      if (value.includes(query)) {
        copy[column] = value.split(query).join(replacement);
        count++;
      }
    });

    return copy;
  });

  if (count > 0) {
    snapshot();
    rows = updatedRows;
    render();
  }

  setStatus(`${count} か所を置換しました。`);
}

function copyTable() {
  const text = rows
    .map(row => `${row.x}\t${row.y}`)
    .join("\n");

  navigator.clipboard.writeText(text)
    .then(() => setStatus("表をコピーしました。"))
    .catch(() => {
      setStatus("コピーできませんでした。ブラウザの権限を確認してください。");
    });
}

document.getElementById("loadButton").addEventListener("click", loadData);
document.getElementById("exportButton").addEventListener("click", exportData);
document.getElementById("addRowButton").addEventListener("click", addRow);
document.getElementById("deleteRowButton").addEventListener("click", deleteSelectedRow);
document.getElementById("copyButton").addEventListener("click", copyTable);
document.getElementById("undoButton").addEventListener("click", undo);
document.getElementById("redoButton").addEventListener("click", redo);

document.getElementById("searchButton").addEventListener("click", () => {
  updateSearch(true);
});

document.getElementById("prevMatchButton").addEventListener("click", () => {
  moveMatch(-1);
});

document.getElementById("nextMatchButton").addEventListener("click", () => {
  moveMatch(1);
});

document.getElementById("replaceButton").addEventListener("click", replaceValues);

searchInput.addEventListener("input", () => updateSearch(true));
searchColumn.addEventListener("change", () => updateSearch(true));

document.addEventListener("keydown", event => {
  if (editing) return;

  const target = event.target;
  if (target === sourceData || target === searchInput ||
      target.tagName === "INPUT" ||
      target.tagName === "TEXTAREA" ||
      target.tagName === "SELECT") {
    return;
  }

  if (event.key === "Enter" && selectedRow !== null) {
    event.preventDefault();
    insertAfterSelected();
    return;
  }

  if (event.key === "Backspace" && selectedRow !== null &&
      selectedCell !== null &&
      rows[selectedRow] &&
      rows[selectedRow][selectedCell] === "") {
    event.preventDefault();
    deleteSelectedRow();
    return;
  }

  if (event.key === "Delete" && selectedRow !== null) {
    event.preventDefault();
    deleteSelectedRow();
    return;
  }

  if (event.key === "ArrowUp" && selectedRow !== null) {
    event.preventDefault();
    selectedRow = Math.max(0, selectedRow - 1);
    render();
    return;
  }

  if (event.key === "ArrowDown" && selectedRow !== null) {
    event.preventDefault();
    selectedRow = Math.min(rows.length - 1, selectedRow + 1);
    render();
    return;
  }

  if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === "z") {
    event.preventDefault();
    undo();
    return;
  }

  if ((event.ctrlKey || event.metaKey) &&
      event.key.toLowerCase() === "y") {
    event.preventDefault();
    redo();
  }
});

render();
</script>

</body>
</html>
